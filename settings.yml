# settings.yml: settings that fw, R, Python, and Stata share
#
# settings.do holds the path globals that do-files use, such as $inputs_raw.
# This file holds the project name, the data catalog for fw_use and fw_save,
# the publishing destinations for fw_publish, and the security settings.
# Framework for Stata (fw_project) reads both files. The directories below
# match settings.do. When the two set a folder differently, this file wins
# and fw_project notes it, so change a folder in both.
default:
  project_name: bayesian-social-statistics-stata
  directories:
    do: do
    docs: docs
    inputs_private_final: inputs/private/final
    inputs_private_intermediate: inputs/private/intermediate
    inputs_private_raw: inputs/private/raw
    inputs_public_final: inputs/public/final
    inputs_public_intermediate: inputs/public/intermediate
    inputs_public_raw: inputs/public/raw
    logs: logs
    cache: outputs/private/cache
    outputs_private_figures: outputs/private/figures
    outputs_private_reports: outputs/private/reports
    outputs_private_tables: outputs/private/tables
    outputs_public_figures: outputs/public/figures
    outputs_public_reports: outputs/public/reports
    outputs_public_tables: outputs/public/tables
    scratch: scratch

  # The data catalog. fw_use and fw_save take a catalog name in place of a
  # path, such as inputs.private.raw.survey, and check the file's checksum when
  # the entry is locked:
  #
  #   data:
  #     inputs:
  #       private:
  #         raw:
  #           survey:
  #             path: inputs/private/raw/survey.csv
  #             locked: true
  # HSLS:09 comes from NCES as a public-use file, but it stays under
  # private/: the files are large, and readers should download them from NCES
  # and accept its data usage agreement themselves. do/01_fetch_hsls.do does
  # that. Read an entry with fw_use inputs.private.raw.hsls_student.
  data:
    inputs:
      public:
        raw:
          hsls_crosswalk:
            path: inputs/public/raw/hsls_crosswalk.csv
            type: csv
            description: >-
              New names for the HSLS:09 variables the series uses, with labels,
              recodes, value labels, and two groups of reserve codes: nonresponse
              (missing) and logical skips (skip). Flags mark the logical skips
              that matter in this series. docs/missing-data.md explains the codes.
              The R, Python, and Stata projects keep identical copies.
          hsls_doc_base_year:
            path: inputs/public/raw/hsls_docs/2011328_1.pdf
            locked: true
            description: >-
              HSLS:09 Base-Year Data File Documentation (NCES 2011-328), volume
              1: design, reserve codes, imputation, and composite variables
              (appendix F), including SES (appendix J). Downloaded from
              https://nces.ed.gov/surveys/hsls09/pdf/2011328_1.pdf. SHA-256
              888a17c972d8d38350f6084be06fce251666cca9ecba22f2af1359400e8faca9.
          hsls_codebook_base_year:
            path: inputs/public/raw/hsls_docs/2011328_2.pdf
            locked: true
            description: >-
              HSLS:09 base-year codebooks (NCES 2011-328, appendix K): every
              base-year variable with its values and frequencies. Downloaded
              from https://nces.ed.gov/surveys/hsls09/pdf/2011328_2.pdf. SHA-256
              9ad7520cca392a38d392ec29c486c4f1e16f30e8e122bbe02b8c64bf9775cf22.
          hsls_codebook_first_follow_up:
            path: inputs/public/raw/hsls_docs/2014361_AppendixI.pdf
            locked: true
            description: >-
              HSLS:09 base-year to first follow-up codebooks (NCES 2014-361,
              appendix I), student and school. Downloaded from
              https://nces.ed.gov/pubs2014/2014361_AppendixI.pdf. SHA-256
              7d5588edb241faa3dc3b15d83bee9de3196bb6b5fc7f4ef6e686560f5702c286.
          hsls_doc_second_follow_up:
            path: inputs/public/raw/hsls_docs/2018140.pdf
            locked: true
            description: >-
              HSLS:09 Base-Year to Second Follow-Up Data File Documentation
              (NCES 2018-140). Table 38 lists the reserve codes in the 2016
              file. Downloaded from https://nces.ed.gov/pubs2018/2018140.pdf.
              SHA-256
              d5a9bef3822b76a964bf5b1ddd095bfbbbea4eb87330a88eb1b050951f6e837b.
      private:
        raw:
          hsls_zip:
            path: inputs/private/raw/hsls/HSLS_2016_v1_0_CSV_Datasets.zip
            locked: true
            description: >-
              HSLS:09 base year to second follow-up public-use file, CSV
              (NCES 2018-142), as downloaded from
              https://nces.ed.gov/EDAT/Data/Zip/HSLS_2016_v1_0_CSV_Datasets.zip.
              SHA-256 a4de968eefbac25a2b6f7337931f8c8051ddfcd2fd82920041a3c8abbebbd4aa.
              NCES data usage agreement: statistical use only, no attempt to
              identify anyone, no linking to identifiable data.
          hsls_student:
            path: inputs/private/raw/hsls/hsls_16_student_v1_0.csv
            type: csv
            locked: true
            description: >-
              HSLS:09 student file, extracted from hsls_zip. One row per
              student (23,503), 8,509 variables. Missing values are reserve
              codes, not blanks: mostly negative (-9, -8, -7, ...), with a few
              positive ones such as 98 and 99 on parent occupation.
          hsls_school:
            path: inputs/private/raw/hsls/hsls_09_school_v1_0.csv
            type: csv
            locked: true
            description: HSLS:09 base-year school file, extracted from hsls_zip.
        final:
          hsls_clean:
            path: inputs/private/final/hsls_clean.csv
            type: csv
            description: >-
              One row per HSLS:09 student with the crosswalk's variables under
              their new names. Built by do/02_clean_hsls.do.
          hsls_clean_stata:
            path: inputs/private/final/hsls_clean.dta
            type: dta
            description: >-
              The same file as hsls_clean, with Stata variable and value labels.

  # This project holds restricted data: fw_table and fw_graph save to the
  # private folders unless told public.
  security:
    sensitive: true

  # Packages the do-files use. fw_packages installs the missing ones from
  # SSC, GitHub (repo, and ref for a version), or a web address (url).
  # project_ado: true installs them into ado/plus in the project folder.
  packages:
    project_ado: true
    default_packages: []

  # fw_scaffold reads these, as scaffold() does in R and Python: the random
  # seed, the graph scheme (stata_scheme, with set_theme_on_scaffold: true),
  # and whether programs in the functions folder load by name.
  scaffold:
    seed_on_scaffold: true
    seed: "123"
    set_theme_on_scaffold: false
    stata_scheme: s2color
    source_all_functions: true

  # Publishing destinations for fw_publish, to(NAME). A folder destination
  # writes each result, with its versions and an offline reader, under path:
  #
  #   publish:
  #     default: results
  #     destinations:
  #       results:
  #         driver: folder
  #         path: published
  #         visibility: private
